title: Home Dashboard
url_path: redesign

views:

  ##############################################
  # VIEW 1: HOME
  ##############################################
  - title: Home
    path: home
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 260px 1fr
          grid-gap: 0px
          height: 100vh
          margin: 0px
          padding: 0px
        cards:

          # ===== SIDEBAR — HOME ACTIVE =====
          - type: vertical-stack
            card_mod:
              style: |
                ha-card {
                  background: rgba(4,10,30,0.98) !important;
                  border-radius: 0 !important;
                  border: none !important;
                  border-right: 1px solid rgba(255,255,255,0.06) !important;
                  box-shadow: none !important;
                  min-height: 100vh;
                  overflow-y: auto;
                }
            cards:
              - type: custom:mushroom-template-card
                primary: Smart Home
                secondary: Dashboard
                icon: mdi:home-variant
                icon_color: blue
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 20px 16px 0; }
                    .primary { font-size: 1.2em !important; font-weight: 700 !important; }
                    .secondary { opacity: 0.4; }
              - type: custom:mushroom-template-card
                primary: "{{ now().strftime('%H:%M') }}"
                secondary: "{{ now().strftime('%A, %-d %B') }}"
                icon: mdi:clock-outline
                icon_color: indigo
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255,255,255,0.03) !important;
                      border: 1px solid rgba(255,255,255,0.06) !important;
                      border-radius: 14px !important;
                      box-shadow: none !important;
                      margin: 12px 14px 4px;
                    }
                    .primary { font-size: 2.6em !important; font-weight: 200 !important; letter-spacing: 2px; }
                    .secondary { opacity: 0.4; }
              - type: custom:mushroom-template-card
                primary: NAVIGATION
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 16px 16px 4px; }
                    .primary { font-size: 0.65em !important; font-weight: 700 !important; opacity: 0.3; letter-spacing: 0.15em; }
              - type: custom:mushroom-template-card
                primary: Home
                icon: mdi:home
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /redesign/home
                card_mod:
                  style: |
                    ha-card { background: rgba(59,130,246,0.18) !important; border: 1px solid rgba(59,130,246,0.4) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Security
                icon: mdi:shield-home
                tap_action:
                  action: navigate
                  navigation_path: /redesign/security
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Energy
                icon: mdi:lightning-bolt
                tap_action:
                  action: navigate
                  navigation_path: /redesign/energy
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Media
                icon: mdi:television-play
                tap_action:
                  action: navigate
                  navigation_path: /redesign/media
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Climate
                icon: mdi:air-conditioner
                tap_action:
                  action: navigate
                  navigation_path: /redesign/climate
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Rooms
                icon: mdi:floor-plan
                tap_action:
                  action: navigate
                  navigation_path: /redesign/rooms
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Lights
                icon: mdi:lightbulb
                tap_action:
                  action: navigate
                  navigation_path: /redesign/lights
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Garden
                icon: mdi:sprinkler-variant
                tap_action:
                  action: navigate
                  navigation_path: /redesign/garden
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Garage
                icon: mdi:garage
                tap_action:
                  action: navigate
                  navigation_path: /redesign/garage
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: Scenes
                icon: mdi:palette
                tap_action:
                  action: navigate
                  navigation_path: /redesign/scenes
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; cursor: pointer; }
              - type: custom:mushroom-template-card
                primary: PEOPLE
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 16px 16px 4px; }
                    .primary { font-size: 0.65em !important; font-weight: 700 !important; opacity: 0.3; letter-spacing: 0.15em; }
              - type: custom:mushroom-template-card
                entity: person.pak
                primary: Pak
                secondary: "{{ states('person.pak') | title }}"
                icon: mdi:account
                icon_color: "{{ 'green' if states('person.pak') == 'home' else 'red' }}"
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px; box-shadow: none !important; }
              - type: custom:mushroom-template-card
                entity: person.dorette
                primary: Dorette
                secondary: "{{ states('person.dorette') | title }}"
                icon: mdi:account
                icon_color: "{{ 'green' if states('person.dorette') == 'home' else 'red' }}"
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 11px !important; margin: 3px 12px 20px; box-shadow: none !important; }

          # ===== MAIN CONTENT: HOME =====
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(4, 1fr)
              gap: 14px
              padding: 20px
              align-content: start
              overflow-y: auto
              max-height: 100vh
            card_mod:
              style: |
                ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
            cards:

              # Section header
              - type: custom:mushroom-template-card
                primary: Overview
                secondary: "{{ now().strftime('%A, %-d %B %Y') }}"
                icon: mdi:view-dashboard
                icon_color: blue
                view_layout:
                  grid-column: span 4
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 4px 0 0; }
                    .primary { font-size: 1.3em !important; font-weight: 700 !important; }

              # Weather forecast
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: daily
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Energy summary
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.alphaess_today_s_energy_from_pv') | float(0) | round(1) }} kWh"
                secondary: "Solar today · {{ states('sensor.alphaess_soc_battery') | int(0) }}% battery"
                icon: mdi:solar-power-variant
                icon_color: "{{ 'yellow' if states('sensor.alphaess_current_pv_production') | float(0) > 0 else 'gray' }}"
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }
                    .primary { font-size: 1.6em !important; font-weight: 300 !important; }

              # PV now
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.alphaess_current_pv_production') | float(0) | round(2) }} kW"
                secondary: Solar Now
                icon: mdi:solar-panel
                icon_color: yellow
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Battery
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.alphaess_soc_battery') | int(0) }}%"
                secondary: "Battery · {{ 'Charging' if states('sensor.alphaess_power_battery') | float(0) > 0 else 'Discharging' if states('sensor.alphaess_power_battery') | float(0) < 0 else 'Idle' }}"
                icon: mdi:battery-high
                icon_color: "{{ 'green' if states('sensor.alphaess_soc_battery') | int(0) > 50 else 'orange' if states('sensor.alphaess_soc_battery') | int(0) > 20 else 'red' }}"
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # House load
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.alphaess_current_house_load') | float(0) | round(2) }} kW"
                secondary: House Load
                icon: mdi:home-lightning-bolt
                icon_color: blue
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Grid
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.alphaess_power_grid') | float(0) | abs | round(2) }} kW"
                secondary: "{{ 'Grid Export' if states('sensor.alphaess_power_grid') | float(0) < 0 else 'Grid Import' }}"
                icon: "{{ 'mdi:transmission-tower-export' if states('sensor.alphaess_power_grid') | float(0) < 0 else 'mdi:transmission-tower-import' }}"
                icon_color: "{{ 'green' if states('sensor.alphaess_power_grid') | float(0) < 0 else 'orange' }}"
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Section: Security
              - type: custom:mushroom-template-card
                primary: Security & Access
                icon: mdi:shield-home
                icon_color: blue
                view_layout:
                  grid-column: span 4
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 8px 0 0; }
                    .primary { font-size: 1.1em !important; font-weight: 600 !important; }

              # Alarm
              - type: alarm-panel
                entity: alarm_control_panel.elkm1_area_1
                states:
                  - arm_away
                  - arm_home
                  - arm_night
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Pak
              - type: custom:mushroom-template-card
                entity: person.pak
                primary: Pak
                secondary: "{{ states('person.pak') | title }}"
                icon: mdi:account
                icon_color: "{{ 'green' if states('person.pak') == 'home' else 'red' }}"
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Dorette
              - type: custom:mushroom-template-card
                entity: person.dorette
                primary: Dorette
                secondary: "{{ states('person.dorette') | title }}"
                icon: mdi:account
                icon_color: "{{ 'green' if states('person.dorette') == 'home' else 'red' }}"
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Doorbell
              - type: custom:mushroom-template-card
                primary: Front Door
                secondary: "{{ 'Ringing!' if states('binary_sensor.front_door_ding_recent') == 'on' else 'Motion' if states('binary_sensor.front_door_motion_recent') == 'on' else 'Clear' }}"
                icon: mdi:doorbell
                icon_color: "{{ 'red' if states('binary_sensor.front_door_ding_recent') == 'on' else 'orange' if states('binary_sensor.front_door_motion_recent') == 'on' else 'gray' }}"
                tap_action:
                  action: navigate
                  navigation_path: /redesign/security
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; cursor: pointer; }

              # Driveway detection
              - type: custom:mushroom-template-card
                primary: Driveway
                secondary: "{{ 'Person detected' if states('binary_sensor.driveway_person_occupancy') == 'on' else 'Car detected' if states('binary_sensor.driveway_car_occupancy') == 'on' else 'Clear' }}"
                icon: mdi:cctv
                icon_color: "{{ 'red' if states('binary_sensor.driveway_person_occupancy') == 'on' or states('binary_sensor.driveway_car_occupancy') == 'on' else 'gray' }}"
                tap_action:
                  action: navigate
                  navigation_path: /redesign/security
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; cursor: pointer; }

              # Section: Quick Controls
              - type: custom:mushroom-template-card
                primary: Quick Controls
                icon: mdi:gesture-tap
                icon_color: blue
                view_layout:
                  grid-column: span 4
                card_mod:
                  style: |
                    ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 8px 0 0; }
                    .primary { font-size: 1.1em !important; font-weight: 600 !important; }

              # Garage 1
              - type: custom:mushroom-template-card
                entity: cover.smart_garage_door_2106156666655336101748e1e9727bf9_garage
                primary: Garage 1
                secondary: "{{ states('cover.smart_garage_door_2106156666655336101748e1e9727bf9_garage') | title }}"
                icon: mdi:garage
                icon_color: "{{ 'red' if states('cover.smart_garage_door_2106156666655336101748e1e9727bf9_garage') == 'open' else 'green' }}"
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; cursor: pointer; }

              # Garage 2
              - type: custom:mushroom-template-card
                entity: cover.smart_garage_door_2110192990473936102348e1e97a2683_garage
                primary: Garage 2
                secondary: "{{ states('cover.smart_garage_door_2110192990473936102348e1e97a2683_garage') | title }}"
                icon: mdi:garage
                icon_color: "{{ 'red' if states('cover.smart_garage_door_2110192990473936102348e1e97a2683_garage') == 'open' else 'green' }}"
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; cursor: pointer; }

              # Vacuum Sophie
              - type: custom:mushroom-template-card
                entity: vacuum.sophie
                primary: Sophie
                secondary: "{{ states('vacuum.sophie') | title }}"
                icon: mdi:robot-vacuum
                icon_color: "{{ 'blue' if states('vacuum.sophie') in ['cleaning','returning'] else 'gray' }}"
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Washer
              - type: custom:mushroom-template-card
                primary: Washer
                secondary: "{{ states('sensor.washer_job_state') | title if states('binary_sensor.washer_power') == 'on' else 'Off' }}"
                icon: mdi:washing-machine
                icon_color: "{{ 'blue' if states('binary_sensor.washer_power') == 'on' else 'gray' }}"
                tap_action:
                  action: more-info
                  entity: binary_sensor.washer_power
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Pool
              - type: custom:mushroom-climate-card
                entity: climate.aqua_temp
                show_temperature_control: true
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Lounge AC
              - type: custom:mushroom-climate-card
                entity: climate.ac_lounge
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }

              # Master AC
              - type: custom:mushroom-climate-card
                entity: climate.ac_master
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card { background: rgba(10,20,55,0.7) !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 16px !important; backdrop-filter: blur(10px); box-shadow: none !important; }


