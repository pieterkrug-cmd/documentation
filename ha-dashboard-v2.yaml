button_card_templates:

  toggle_card:
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    show_name: true
    show_state: true
    show_icon: true
    variables:
      category: ""
    state_display: |
      [[[
        const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
        return on ? 'AN' : 'AUS';
      ]]]
    custom_fields:
      cat: "[[[ return variables.category ]]]"
      tog: |
        [[[
          const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
          const bg = on ? '#3b82f6' : 'rgba(255,255,255,0.09)';
          const x = on ? '19px' : '2px';
          const ds = on ? '0 2px 8px rgba(59,130,246,0.6)' : '0 1px 4px rgba(0,0,0,0.5)';
          return '<div style="width:40px;height:22px;border-radius:11px;background:' + bg + ';display:flex;align-items:center;padding:0 2px;box-sizing:border-box;transition:background .28s ease;flex-shrink:0"><div style="width:18px;height:18px;border-radius:50%;background:white;transform:translateX(' + x + ');transition:transform .24s cubic-bezier(0.4,0,0.2,1);box-shadow:' + ds + '"></div></div>';
        ]]]
    styles:
      card:
        - background: |
            [[[
              const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
              return on ? 'rgb(11,22,58)' : 'rgb(8,12,32)';
            ]]]
        - border-radius: 14px
        - border: |
            [[[
              const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
              return on ? '1px solid rgba(59,130,246,0.3)' : '1px solid rgba(255,255,255,0.04)';
            ]]]
        - box-shadow: |
            [[[
              const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
              return on ? '0 4px 20px rgba(59,130,246,0.13), inset 0 1px 0 rgba(255,255,255,0.05)' : 'inset 0 1px 0 rgba(255,255,255,0.025)';
            ]]]
        - transition: "background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease"
        - padding: 9px 11px 11px
        - cursor: pointer
      grid:
        - grid-template-areas: '"cat cat tog" "i n s"'
        - grid-template-columns: auto 1fr auto
        - grid-template-rows: auto auto
        - row-gap: 9px
        - column-gap: 6px
      custom_fields:
        cat:
          - font-size: 0.47em
          - font-weight: "700"
          - opacity: "0.22"
          - text-transform: uppercase
          - letter-spacing: 0.15em
          - color: white
          - align-self: center
          - justify-self: start
          - white-space: nowrap
        tog:
          - align-self: center
          - justify-self: end
      icon:
        - width: 16px
        - color: |
            [[[
              const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
              return on ? '#93c5fd' : 'rgba(255,255,255,0.18)';
            ]]]
      name:
        - font-size: 0.76em
        - font-weight: "500"
        - align-self: center
        - justify-self: start
        - color: |
            [[[
              const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
              return on ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.5)';
            ]]]
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - letter-spacing: "-0.01em"
      state:
        - font-size: 0.65em
        - font-weight: "700"
        - align-self: center
        - justify-self: end
        - letter-spacing: 0.07em
        - color: |
            [[[
              const on = ['on','open','opening','heating','cooling','fan_only','cleaning','returning','active'].includes(entity && entity.state);
              return on ? 'rgba(147,197,253,0.95)' : 'rgba(255,255,255,0.18)';
            ]]]

  climate_card:
    tap_action:
      action: more-info
    show_name: true
    show_state: false
    show_icon: true
    variables:
      category: ""
    custom_fields:
      cat: "[[[ return variables.category ]]]"
      ctemp: |
        [[[
          if (!entity) return '--';
          const c = entity.attributes.current_temperature;
          const s = entity.attributes.temperature;
          if (c !== undefined && s !== undefined) return c + '° / ' + s + '°';
          if (c !== undefined) return c + '°';
          return '--';
        ]]]
      cmode: |
        [[[
          if (!entity) return 'AUS';
          const m = entity.state;
          if (m === 'heat') return 'HEIZEN';
          if (m === 'cool') return 'KÜHLEN';
          if (m === 'heat_cool') return 'AUTO';
          if (m === 'fan_only') return 'FAN';
          if (m === 'dry') return 'DRY';
          return 'AUS';
        ]]]
    styles:
      card:
        - background: |
            [[[
              if (!entity) return 'rgb(8,12,32)';
              return entity.state !== 'off' ? 'rgb(11,22,58)' : 'rgb(8,12,32)';
            ]]]
        - border-radius: 14px
        - border: |
            [[[
              if (!entity) return '1px solid rgba(255,255,255,0.04)';
              return entity.state !== 'off' ? '1px solid rgba(59,130,246,0.3)' : '1px solid rgba(255,255,255,0.04)';
            ]]]
        - box-shadow: |
            [[[
              if (!entity) return 'none';
              return entity.state !== 'off' ? '0 4px 20px rgba(59,130,246,0.13), inset 0 1px 0 rgba(255,255,255,0.05)' : 'inset 0 1px 0 rgba(255,255,255,0.025)';
            ]]]
        - transition: "background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease"
        - padding: 9px 11px 11px
        - cursor: pointer
      grid:
        - grid-template-areas: '"cat cat ctemp" "i n cmode"'
        - grid-template-columns: auto 1fr auto
        - grid-template-rows: auto auto
        - row-gap: 9px
        - column-gap: 6px
      custom_fields:
        cat:
          - font-size: 0.47em
          - font-weight: "700"
          - opacity: "0.22"
          - text-transform: uppercase
          - letter-spacing: 0.15em
          - color: white
          - align-self: center
          - justify-self: start
        ctemp:
          - font-size: 0.88em
          - font-weight: "300"
          - color: "rgba(255,255,255,0.85)"
          - align-self: center
          - justify-self: end
          - white-space: nowrap
          - letter-spacing: "-0.02em"
        cmode:
          - font-size: 0.65em
          - font-weight: "700"
          - letter-spacing: 0.07em
          - align-self: center
          - justify-self: end
          - color: |
              [[[
                return (entity && entity.state !== 'off') ? 'rgba(147,197,253,0.95)' : 'rgba(255,255,255,0.18)';
              ]]]
      icon:
        - width: 16px
        - color: |
            [[[
              return (entity && entity.state !== 'off') ? '#93c5fd' : 'rgba(255,255,255,0.18)';
            ]]]
      name:
        - font-size: 0.76em
        - font-weight: "500"
        - align-self: center
        - justify-self: start
        - letter-spacing: "-0.01em"
        - color: |
            [[[
              return (entity && entity.state !== 'off') ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.5)';
            ]]]

  sensor_card:
    tap_action:
      action: more-info
    show_name: true
    show_state: true
    show_icon: true
    variables:
      category: ""
    custom_fields:
      cat: "[[[ return variables.category ]]]"
    styles:
      card:
        - background: "rgb(8,12,32)"
        - border-radius: 14px
        - border: "1px solid rgba(255,255,255,0.04)"
        - box-shadow: "inset 0 1px 0 rgba(255,255,255,0.025)"
        - padding: 9px 11px 11px
      grid:
        - grid-template-areas: '"cat cat ." "i n s"'
        - grid-template-columns: auto 1fr auto
        - grid-template-rows: auto auto
        - row-gap: 9px
        - column-gap: 6px
      custom_fields:
        cat:
          - font-size: 0.47em
          - font-weight: "700"
          - opacity: "0.22"
          - text-transform: uppercase
          - letter-spacing: 0.15em
          - color: white
          - align-self: center
          - justify-self: start
      icon:
        - width: 16px
        - color: "rgba(255,255,255,0.38)"
      name:
        - font-size: 0.76em
        - font-weight: "500"
        - align-self: center
        - justify-self: start
        - color: "rgba(255,255,255,0.58)"
        - letter-spacing: "-0.01em"
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      state:
        - font-size: 0.92em
        - font-weight: "300"
        - align-self: center
        - justify-self: end
        - color: "rgba(255,255,255,0.88)"
        - letter-spacing: "-0.02em"
        - white-space: nowrap

  presence_card:
    show_entity_picture: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    state_display: |
      [[[
        return (entity && entity.state === 'home') ? 'ZUHAUSE' : 'WEG';
      ]]]
    custom_fields:
      cat: "PERSON"
    styles:
      card:
        - background: |
            [[[
              return (entity && entity.state === 'home') ? 'rgb(11,22,58)' : 'rgb(8,12,32)';
            ]]]
        - border: |
            [[[
              return (entity && entity.state === 'home') ? '1px solid rgba(59,130,246,0.3)' : '1px solid rgba(255,255,255,0.04)';
            ]]]
        - border-radius: 14px
        - box-shadow: |
            [[[
              return (entity && entity.state === 'home') ? '0 4px 20px rgba(59,130,246,0.13)' : 'inset 0 1px 0 rgba(255,255,255,0.025)';
            ]]]
        - transition: "background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease"
        - padding: 9px 11px 11px
      grid:
        - grid-template-areas: '"cat cat ." "i n s"'
        - grid-template-columns: auto 1fr auto
        - grid-template-rows: auto auto
        - row-gap: 9px
        - column-gap: 6px
      custom_fields:
        cat:
          - font-size: 0.47em
          - font-weight: "700"
          - opacity: "0.22"
          - text-transform: uppercase
          - letter-spacing: 0.15em
          - color: white
          - align-self: center
          - justify-self: start
      entity_picture:
        - width: 28px
        - height: 28px
        - border-radius: 50%
        - border: |
            [[[
              return (entity && entity.state === 'home') ? '2px solid rgba(147,197,253,0.7)' : '2px solid rgba(255,255,255,0.15)';
            ]]]
      name:
        - font-size: 0.76em
        - font-weight: "500"
        - color: "rgba(255,255,255,0.82)"
        - align-self: center
        - justify-self: start
        - letter-spacing: "-0.01em"
      state:
        - font-size: 0.65em
        - font-weight: "700"
        - letter-spacing: 0.07em
        - align-self: center
        - justify-self: end
        - color: |
            [[[
              return (entity && entity.state === 'home') ? 'rgba(147,197,253,0.95)' : 'rgba(255,100,100,0.65)';
            ]]]

  scene_card:
    tap_action:
      action: toggle
    show_name: true
    show_state: false
    show_icon: true
    variables:
      category: ""
    custom_fields:
      cat: "[[[ return variables.category ]]]"
    styles:
      card:
        - background: "rgb(8,12,32)"
        - border-radius: 14px
        - border: "1px solid rgba(255,255,255,0.04)"
        - box-shadow: "inset 0 1px 0 rgba(255,255,255,0.025)"
        - padding: 9px 11px 11px
        - cursor: pointer
      grid:
        - grid-template-areas: '"cat cat ." "i n ."'
        - grid-template-columns: auto 1fr auto
        - grid-template-rows: auto auto
        - row-gap: 9px
        - column-gap: 6px
      custom_fields:
        cat:
          - font-size: 0.47em
          - font-weight: "700"
          - opacity: "0.22"
          - text-transform: uppercase
          - letter-spacing: 0.15em
          - color: white
          - align-self: center
          - justify-self: start
      icon:
        - width: 16px
        - color: "rgba(147,197,253,0.6)"
      name:
        - font-size: 0.76em
        - font-weight: "500"
        - align-self: center
        - justify-self: start
        - color: "rgba(255,255,255,0.75)"
        - letter-spacing: "-0.01em"

  nav_item:
    show_name: true
    show_icon: true
    show_state: false
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: 6px 10px
        - border-radius: 7px
        - cursor: pointer
        - margin: 1px 5px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: auto 1fr
        - column-gap: 7px
      icon:
        - width: 13px
        - color: "rgba(255,255,255,0.26)"
      name:
        - font-size: 0.56em
        - font-weight: "600"
        - letter-spacing: 0.1em
        - text-transform: uppercase
        - color: "rgba(255,255,255,0.3)"
        - justify-self: start
        - white-space: nowrap

  nav_active:
    show_name: true
    show_icon: true
    show_state: false
    styles:
      card:
        - background: "rgba(59,130,246,0.12)"
        - border: "1px solid rgba(59,130,246,0.22)"
        - box-shadow: none
        - padding: 6px 10px
        - border-radius: 7px
        - cursor: pointer
        - margin: 1px 5px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: auto 1fr
        - column-gap: 7px
      icon:
        - width: 13px
        - color: "#93c5fd"
      name:
        - font-size: 0.56em
        - font-weight: "700"
        - letter-spacing: 0.1em
        - text-transform: uppercase
        - color: "#93c5fd"
        - justify-self: start
        - white-space: nowrap

  person_card:
    show_entity_picture: true
    show_name: true
    show_state: false
    tap_action:
      action: more-info
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: 3px 8px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: auto 1fr
        - column-gap: 7px
      entity_picture:
        - width: 26px
        - height: 26px
        - border-radius: 50%
        - border: "2px solid rgba(255,255,255,0.18)"
      name:
        - font-size: 0.56em
        - font-weight: "600"
        - letter-spacing: 0.07em
        - text-transform: uppercase
        - color: "rgba(255,255,255,0.4)"
        - justify-self: start

title: Smart Home
url_path: redesign

views:

  ##############################################
  # VIEW 1: HOME
  ##############################################
  - title: Home
    path: home
    panel: true
    background: "rgb(4,7,20)"
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 120px 1fr
          height: 100vh
          margin: 0
          padding: 0
          gap: 0
        cards:

          # ── SIDEBAR ───────────────────────────
          - type: vertical-stack
            card_mod:
              style: |
                ha-card {
                  background: rgb(3,5,14) !important;
                  border-radius: 0 !important;
                  border-right: 1px solid rgba(255,255,255,0.04) !important;
                  box-shadow: none !important;
                  min-height: 100vh;
                  overflow-y: auto;
                  padding-bottom: 16px;
                }
            cards:
              - type: custom:button-card
                entity: sun.sun
                show_name: false
                show_state: false
                show_icon: false
                custom_fields:
                  clk: "[[[ return new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}) ]]]"
                  dt: "[[[ return new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}).toUpperCase() ]]]"
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - padding: 18px 10px 8px
                  grid:
                    - grid-template-areas: '"clk" "dt"'
                  custom_fields:
                    clk:
                      - font-size: 2.3em
                      - font-weight: 200
                      - letter-spacing: 1px
                      - color: "rgba(255,255,255,0.92)"
                      - justify-self: start
                      - line-height: "1"
                    dt:
                      - font-size: 0.48em
                      - opacity: "0.28"
                      - color: white
                      - justify-self: start
                      - letter-spacing: 0.1em
                      - margin-top: 5px
                      - font-weight: "600"
              - type: custom:button-card
                template: nav_active
                name: Home
                icon: mdi:home-variant
                tap_action: {action: navigate, navigation_path: /redesign/home}
              - type: custom:button-card
                template: nav_item
                name: Security
                icon: mdi:shield-home
                tap_action: {action: navigate, navigation_path: /redesign/security}
              - type: custom:button-card
                template: nav_item
                name: Energy
                icon: mdi:solar-power-variant
                tap_action: {action: navigate, navigation_path: /redesign/energy}
              - type: custom:button-card
                template: nav_item
                name: Media
                icon: mdi:television-play
                tap_action: {action: navigate, navigation_path: /redesign/media}
              - type: custom:button-card
                template: nav_item
                name: Climate
                icon: mdi:air-conditioner
                tap_action: {action: navigate, navigation_path: /redesign/climate}
              - type: custom:button-card
                template: nav_item
                name: Rooms
                icon: mdi:floor-plan
                tap_action: {action: navigate, navigation_path: /redesign/rooms}
              - type: custom:button-card
                template: nav_item
                name: Lights
                icon: mdi:lightbulb-multiple
                tap_action: {action: navigate, navigation_path: /redesign/lights}
              - type: custom:button-card
                template: nav_item
                name: Garden
                icon: mdi:sprinkler-variant
                tap_action: {action: navigate, navigation_path: /redesign/garden}
              - type: custom:button-card
                template: nav_item
                name: Garage
                icon: mdi:garage
                tap_action: {action: navigate, navigation_path: /redesign/garage}
              - type: custom:button-card
                template: nav_item
                name: Scenes
                icon: mdi:palette
                tap_action: {action: navigate, navigation_path: /redesign/scenes}
              - type: custom:button-card
                show_name: false
                show_state: false
                show_icon: false
                custom_fields:
                  lbl: "PEOPLE"
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - padding: 10px 10px 2px
                  grid:
                    - grid-template-areas: '"lbl"'
                  custom_fields:
                    lbl:
                      - font-size: 0.5em
                      - opacity: "0.25"
                      - color: white
                      - letter-spacing: 0.15em
                      - font-weight: "700"
                      - justify-self: start
              - type: custom:button-card
                template: person_card
                entity: person.pak
                name: Pak
              - type: custom:button-card
                template: person_card
                entity: person.dorette
                name: Dorette

          # ── CONTENT ───────────────────────────
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(3, 1fr)
              gap: 10px
              padding: 14px
              align-content: start
              overflow-y: auto
              max-height: 100vh
            cards:

              # Weather — span 2
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: daily
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card {
                      background: rgb(8,12,32) !important;
                      border: 1px solid rgba(255,255,255,0.06) !important;
                      border-radius: 12px !important;
                      box-shadow: none !important;
                    }

              # Energy status — col 3
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: sensor_card
                    entity: sensor.alphaess_current_pv_production
                    name: Solar Now
                    icon: mdi:solar-panel
                    variables:
                      category: ENERGIE
                  - type: custom:button-card
                    template: sensor_card
                    entity: sensor.alphaess_soc_battery
                    name: Battery
                    icon: mdi:battery-high
                    variables:
                      category: ENERGIE
                  - type: custom:button-card
                    template: sensor_card
                    entity: sensor.alphaess_current_house_load
                    name: House Load
                    icon: mdi:home-lightning-bolt
                    variables:
                      category: ENERGIE

              # Alarm — span 2
              - type: alarm-panel
                entity: alarm_control_panel.elkm1_area_1
                states:
                  - arm_away
                  - arm_home
                  - arm_night
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card {
                      background: rgb(8,12,32) !important;
                      border: 1px solid rgba(255,255,255,0.06) !important;
                      border-radius: 12px !important;
                      box-shadow: none !important;
                    }

              # People — col 3
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: presence_card
                    entity: person.pak
                    name: Pak
                  - type: custom:button-card
                    template: presence_card
                    entity: person.dorette
                    name: Dorette

              # Row 3: Garage 1 | Garage 2 | Pool
              - type: custom:button-card
                template: toggle_card
                entity: cover.smart_garage_door_2106156666655336101748e1e9727bf9_garage
                name: Garage 1
                icon: mdi:garage
                variables:
                  category: GARAGE
              - type: custom:button-card
                template: toggle_card
                entity: cover.smart_garage_door_2110192990473936102348e1e97a2683_garage
                name: Garage 2
                icon: mdi:garage
                variables:
                  category: GARAGE
              - type: custom:button-card
                template: climate_card
                entity: climate.aqua_temp
                name: Pool Pump
                icon: mdi:pool
                variables:
                  category: POOL

              # Row 4: Vacuum | Doorbell | Lounge AC
              - type: custom:button-card
                template: toggle_card
                entity: vacuum.sophie
                name: Sophie
                icon: mdi:robot-vacuum
                tap_action: {action: more-info}
                variables:
                  category: VACUUM
              - type: custom:button-card
                entity: binary_sensor.front_door_ding_recent
                name: Doorbell
                icon: mdi:doorbell-video
                show_name: true
                show_state: true
                show_icon: true
                tap_action: {action: navigate, navigation_path: /redesign/security}
                state_display: "[[[ return entity.state === 'on' ? 'DING!' : 'CLEAR'; ]]]"
                custom_fields:
                  cat: "SECURITY"
                styles:
                  card:
                    - background: "rgb(8,12,32)"
                    - border-radius: 12px
                    - border: "1px solid rgba(255,255,255,0.06)"
                    - box-shadow: none
                    - padding: 10px 12px 12px
                    - cursor: pointer
                  grid:
                    - grid-template-areas: '"cat cat ." "i n s"'
                    - grid-template-columns: auto 1fr auto
                    - grid-template-rows: auto auto
                    - row-gap: 8px
                    - column-gap: 6px
