                  grid:
                    - grid-template-areas: '"lbl"'
                  custom_fields:
                    lbl:
                      - font-size: 0.5em
                      - opacity: "0.25"
                      - color: white
                      - letter-spacing: 0.15em
                      - font-weight: "700"
                      - justify-self: start
              - type: custom:button-card
                template: person_card
                entity: person.pak
                name: Pak
              - type: custom:button-card
                template: person_card
                entity: person.dorette
                name: Dorette

          # ── CONTENT ───────────────────────────
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(3, 1fr)
              gap: 10px
              padding: 14px
              align-content: start
              overflow-y: auto
              max-height: 100vh
            cards:

              # AC units
              - type: custom:button-card
                template: climate_card
                entity: climate.ac_lounge
                name: Lounge AC
                icon: mdi:air-conditioner
                variables:
                  category: KLIMAANLAGE
              - type: custom:button-card
                template: climate_card
                entity: climate.ac_master
                name: Master Bedroom
                icon: mdi:air-conditioner
                variables:
                  category: KLIMAANLAGE
              - type: custom:button-card
                template: climate_card
                entity: climate.ac_study
                name: Study
                icon: mdi:air-conditioner
                variables:
                  category: KLIMAANLAGE
              - type: custom:button-card
                template: climate_card
                entity: climate.ac_carla
                name: Carla's Room
                icon: mdi:air-conditioner
                variables:
                  category: KLIMAANLAGE

              # Pool heat pump — full mushroom card for temp control
              - type: custom:mushroom-climate-card
                entity: climate.aqua_temp
                name: Pool Heat Pump
                show_temperature_control: true
                view_layout:
                  grid-column: span 2
                card_mod:
                  style: |
                    ha-card {
                      background: rgb(8,12,32) !important;
                      border: 1px solid rgba(255,255,255,0.06) !important;
                      border-radius: 12px !important;
                      box-shadow: none !important;
                    }

              # Pool sensors
              - type: custom:button-card
                template: sensor_card
                entity: climate.aqua_temp
                name: Pool Water Temp
                icon: mdi:thermometer-water
                state_display: |
                  [[[
                    if (!entity) return '--';
                    const t = entity.attributes.current_temperature;
                    return t !== undefined ? t + ' °C' : '--';
                  ]]]
                variables:
                  category: POOL
              - type: custom:button-card
                template: sensor_card
                entity: climate.aqua_temp
                name: Pool Set Point
                icon: mdi:target
                state_display: |
                  [[[
                    if (!entity) return '--';
                    const t = entity.attributes.temperature;
                    return t !== undefined ? t + ' °C' : '--';
                  ]]]
                variables:
                  category: POOL


