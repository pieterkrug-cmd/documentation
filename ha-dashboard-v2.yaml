  - title: Climate
    path: climate
    panel: true
    background: "rgb(4,7,20)"
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 120px 1fr
          height: 100vh
          margin: 0
          padding: 0
          gap: 0
        cards:

          # ── SIDEBAR ───────────────────────────
          - type: vertical-stack
            card_mod:
              style: |
                ha-card {
                  background: rgb(3,5,14) !important;
                  border-radius: 0 !important;
                  border-right: 1px solid rgba(255,255,255,0.04) !important;
                  box-shadow: none !important;
                  min-height: 100vh;
                  overflow-y: auto;
                  padding-bottom: 16px;
                }
            cards:
              - type: custom:button-card
                entity: sun.sun
                show_name: false
                show_state: false
                show_icon: false
                custom_fields:
                  clk: "[[[ return new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}) ]]]"
                  dt: "[[[ return new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}).toUpperCase() ]]]"
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - padding: 18px 10px 8px
                  grid:
                    - grid-template-areas: '"clk" "dt"'
                  custom_fields:
                    clk:
                      - font-size: 2.3em
                      - font-weight: 200
                      - letter-spacing: 1px
                      - color: "rgba(255,255,255,0.92)"
                      - justify-self: start
