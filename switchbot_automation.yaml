automation:
  - alias: "SwitchBot Toggle On at 4:00 AM"
    description: "Turn on SwitchBot device at 4:00 AM daily"
    trigger:
      - platform: time
        at: "04:00:00"
    condition: []
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.switchbot_device
    mode: single

  - alias: "SwitchBot Toggle Off at 7:00 AM"
    description: "Turn off SwitchBot device at 7:00 AM daily"
    trigger:
      - platform: time
        at: "07:00:00"
    condition: []
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.switchbot_device
    mode: single
